name: Tao IPA chua ky

on:
  push:
    branches: [main]
    paths:
      - "MaNguon/**"
      - "TaiNguyen/**"
      - "project.yml"
      - ".github/workflows/tao-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tao-ipa:
    runs-on: macos-15
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Kiem tra tai nguyen bat buoc
        run: |
          ICON="TaiNguyen/HinhAnh.xcassets/BieuTuongUngDung.appiconset/BieuTuong-1024.png"
          JSON="TaiNguyen/VideoMacDinh.json"
          test -f "$ICON" || { echo "Thieu icon: $ICON"; exit 1; }
          test -f "$JSON" || { echo "Thieu danh sach video: $JSON"; exit 1; }
          W=$(sips -g pixelWidth "$ICON" | tail -n 1 | awk '{print $2}')
          H=$(sips -g pixelHeight "$ICON" | tail -n 1 | awk '{print $2}')
          [ -n "$W" ] && [ -n "$H" ] || { echo "Khong doc duoc kich thuoc icon"; exit 1; }
          [ "$W" = "$H" ] || { echo "Icon phai la anh vuong. Kich thuoc hien tai: ${W}x${H}"; exit 1; }
          if [ "$W" != "1024" ]; then
            echo "Tu dong chuyen icon tu ${W}x${H} thanh 1024x1024..."
            TMP_ICON="build/BieuTuong-1024.png"
            mkdir -p build
            sips -s format png -z 1024 1024 "$ICON" --out "$TMP_ICON"
            cp "$TMP_ICON" "$ICON"
          fi
          python3 -m json.tool "$JSON" > /dev/null
          echo "Icon vuong hop le va da san sang o kich thuoc 1024x1024."

      - name: Tao du an Xcode
        run: xcodegen generate

      - name: Kiem tra scheme
        run: xcodebuild -list -project BeXemVui.xcodeproj

      - name: Tao archive chua ky
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild archive \
            -project BeXemVui.xcodeproj \
            -scheme BeXemVui \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BeXemVui.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build/xcodebuild.log

      - name: Hien thi loi Swift
        if: failure()
        run: |
          echo "===== CAC DONG LOI SWIFT ====="
          grep -n -E "error:|fatal error:" build/xcodebuild.log || true

      - name: Luu log build neu co loi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XcodeBuild-Log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Kiem tra tai nguyen trong app
        run: |
          APP="build/BeXemVui.xcarchive/Products/Applications/BeXemVui.app"
          JSON_TRONG_APP=$(find "$APP" -name "VideoMacDinh.json" -type f | head -n 1)
          test -n "$JSON_TRONG_APP" || { echo "VideoMacDinh.json khong co trong app bundle"; find "$APP" -maxdepth 3 -type f; exit 1; }
          echo "Da tim thay: $JSON_TRONG_APP"
          test -f "$APP/Assets.car" || { echo "Assets.car khong ton tai, icon chua duoc bien dich"; find "$APP" -maxdepth 3 -type f; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"

      - name: Dong goi IPA
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R build/BeXemVui.xcarchive/Products/Applications/BeXemVui.app build/Payload/
          cd build
          zip -r -9 BeXemVui.ipa Payload

      - name: Luu IPA vao Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BeXemVui-IPA
          path: build/BeXemVui.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Tao ten ban phat hanh
        id: ten_ban
        run: echo "the=ban-$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Dua IPA len Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ten_ban.outputs.the }}
          name: Be Xem Vui ${{ steps.ten_ban.outputs.the }}
          body: "IPA chua ky. Hay ky bang ESign truoc khi cai len iPhone/iPad."
          files: build/BeXemVui.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
